<style>
/* ============ reset / base ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { background:#0c120f; color:#e8e6df; font-family:Figtree, system-ui, sans-serif; overflow:hidden; }
button { font-family:inherit; }
input, textarea, select { font-family:inherit; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:rgba(227,197,103,.18); border-radius:6px; }
::-webkit-scrollbar-thumb:hover { background:rgba(227,197,103,.32); }
::-webkit-scrollbar-track { background:transparent; }

/* ============ slide stage (shared by preview / present / thumbs / print) ============ */
@keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
@keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes zoomIn { from { opacity:0; transform:scale(.86); } to { opacity:1; transform:scale(1); } }
@keyframes slideL { from { opacity:0; transform:translateX(-60px); } to { opacity:1; transform:none; } }
@keyframes drift { 0% { transform:translate(0,0); opacity:.25; } 50% { transform:translate(24px,-38px); opacity:.9; } 100% { transform:translate(0,0); opacity:.25; } }
@keyframes breathe { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.18); opacity:.85; } }
@keyframes nudge { 0%,100% { transform:translateX(0); } 50% { transform:translateX(14px); } }
@keyframes inFromR { from { opacity:0; transform:translateX(90px); } to { opacity:1; transform:none; } }
@keyframes inFromL { from { opacity:0; transform:translateX(-90px); } to { opacity:1; transform:none; } }
@keyframes outToL { from { opacity:1; transform:none; } to { opacity:0; transform:translateX(-70px); } }
@keyframes outToR { from { opacity:1; transform:none; } to { opacity:0; transform:translateX(70px); } }
@keyframes zoomInLayer { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:scale(1); } }
@keyframes zoomOutLayer { from { opacity:1; transform:scale(1); } to { opacity:0; transform:scale(1.05); } }

.stage { position:absolute; inset:0; width:1920px; height:1080px; font-family:Figtree, system-ui, sans-serif; color:var(--ink); overflow:hidden; }
.stage .fp { font-family:Poppins, Figtree, sans-serif; }
.stage .acc { color:var(--acc); }
.stage a { color:var(--acc); text-decoration:underline; text-underline-offset:.18em; text-decoration-thickness:2px; text-decoration-color:rgba(227,197,103,.45); text-decoration-color:rgba(var(--acc-rgb),.45); }
.stage a:hover { color:var(--accB); text-decoration-color:rgba(var(--acc-rgb),.9); }
.static * { animation:none !important; transition:none !important; }

/* ============ studio (designer) ============ */
#app { height:100%; }
.studio { display:grid; grid-template-rows:56px 1fr; height:100%; }
.topbar { display:flex; align-items:center; gap:10px; padding:0 14px; background:#111a15; border-bottom:1px solid rgba(227,197,103,.14); }
.brand { font-family:Poppins; font-weight:800; font-size:17px; letter-spacing:-.02em; color:#E3C567; margin-right:6px; white-space:nowrap; }
.brand span { color:#e8e6df; }
.brand .ver { font-family:Figtree, sans-serif; font-style:normal; font-weight:500; font-size:10px; letter-spacing:.05em; color:rgba(232,230,223,.38); margin-left:7px; vertical-align:2px; }
.gver { font-size:11px; color:rgba(232,230,223,.35); margin-right:auto; align-self:center; }
.deck-title { background:rgba(var(--card-rgb),.05); border:1px solid rgba(227,197,103,.16); color:#f2f0e9; border-radius:8px; padding:7px 12px; font-size:14px; flex:1 1 220px; min-width:150px; max-width:420px; }
.deck-title:focus { outline:none; border-color:rgba(227,197,103,.5); }
.tb-spacer { flex:1; }
.tb-sep { width:1px; height:24px; background:rgba(227,197,103,.16); margin:0 4px; flex:none; }
.btn { background:rgba(255,255,255,.06); color:#e8e6df; border:1px solid rgba(227,197,103,.2); border-radius:8px; padding:7px 13px; font-size:13px; cursor:pointer; white-space:nowrap; }
.btn:hover { background:rgba(227,197,103,.14); border-color:rgba(227,197,103,.4); }
.btn.primary { background:linear-gradient(96deg,#E3C567,#F2DD9B); color:#0B2318; font-weight:700; border:none; }
.btn.primary:hover { filter:brightness(1.06); }
.btn.danger:hover { background:rgba(222,80,60,.2); border-color:rgba(222,80,60,.5); }
.btn.small { padding:4px 9px; font-size:12px; }
.btn:disabled { opacity:.32; cursor:default; }
.btn:disabled:hover { background:rgba(255,255,255,.06); border-color:rgba(227,197,103,.2); }
.btn.round { width:32px; height:32px; padding:0; border-radius:50%; font-family:Poppins; font-weight:700; font-size:14px; display:inline-grid; place-items:center; flex:none; }
.save-dot { font-size:11px; color:rgba(232,230,223,.45); min-width:62px; white-space:nowrap; }
.tbmenu { position:relative; }
.tbmenu .caret { display:inline-block; margin-left:7px; font-size:9px; opacity:.6; vertical-align:1px; }
.tbmenu.open > .btn { background:rgba(227,197,103,.14); border-color:rgba(227,197,103,.4); }
.tbmenu-pop { display:none; position:absolute; top:calc(100% + 6px); left:0; min-width:230px; background:#131c16; border:1px solid rgba(227,197,103,.28); border-radius:10px; padding:6px; z-index:60; box-shadow:0 14px 34px rgba(0,0,0,.45); }
.tbmenu.open .tbmenu-pop { display:block; }
.tbmenu-pop button { display:flex; width:100%; align-items:center; background:none; border:none; color:#e8e6df; font-size:13px; text-align:left; padding:8px 10px; border-radius:7px; cursor:pointer; white-space:nowrap; }
.tbmenu-pop button:hover { background:rgba(227,197,103,.14); color:#F2DD9B; }
.tbmenu-pop button small { margin-left:auto; padding-left:20px; font-size:11px; color:rgba(232,230,223,.4); }

.main { display:grid; grid-template-columns:270px 1fr 330px; min-height:0; }

/* slide list */
.slidelist { background:#0f1712; border-right:1px solid rgba(227,197,103,.12); overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
.sl-item { display:flex; align-items:center; gap:8px; padding:8px 9px; border:1px solid rgba(227,197,103,.12); border-radius:9px; cursor:pointer; background:rgba(255,255,255,.025); position:relative; }
.sl-item:hover { background:rgba(255,255,255,.06); }
.sl-item.sel { border-color:rgba(227,197,103,.65); background:rgba(227,197,103,.1); }
.sl-item.child { margin-left:20px; }
.sl-item.child::before { content:''; position:absolute; left:-13px; top:50%; width:9px; height:1px; background:rgba(227,197,103,.35); }
.sl-item.dragover { border-top:2px solid #E3C567; }
.sl-item.hid { opacity:.45; }

<script>
'use strict';
const APP_VERSION = '1.4.0';
/* A published player file carries its deck in a #baked-deck tag (in <head>, so it's parsed before this script) */
const BAKED = document.getElementById('baked-deck');
const PLAYER = !!BAKED;
/* =====================================================================
   Greenroom — single-file deck designer + presenter
   Modes: design (default) · #present · #print
   Storage: IndexedDB (decks), localStorage (current-deck pointer only)
===================================================================== */

/* ---------------- utilities ---------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => 's' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
/* rich text: escape, then [text](url) links, [[gold]], {{orange}}, newline -> <br> */
const rich = t => esc(t)
  .replace(/\[([^\[\]\n]+?)\]\(([^)\s]+?)\)/g, (m, txt, url) => {
    let u = url.trim();
    if (/^javascript:/i.test(u)) return txt;
    if (!/^(https?:|mailto:)/i.test(u)) u = 'https://' + u;
    return `<a href="${u}" target="_blank" rel="noopener">${txt}</a>`;
  })
  .replace(/\[\[(.+?)\]\]/gs, '<span class="acc">$1</span>')

function hexRgb(h) { h = String(h||'').replace('#',''); if (h.length === 3) h = h.split('').map(c => c+c).join(''); const n = parseInt(h, 16) || 0; return [n>>16&255, n>>8&255, n&255]; }

  const isLight = lum(ct.bg) > .5;

  return {
    name: 'Custom',
    vars: {
      '--ink': ct.ink, '--ink-rgb': rgbStr(ct.ink),
      '--acc': ct.acc, '--acc-rgb': rgbStr(ct.acc), '--accB': mixHex(ct.acc, isLight?'#000000':'#ffffff', .28),
      '--acc2': ct.acc2, '--acc2-rgb': rgbStr(ct.acc2), '--acc2Soft': mixHex(ct.acc2, isLight?'#000000':'#ffffff', isLight?.35:.45),
      '--deep': isLight ? '#ffffff' : darkBase,
      '--card-rgb': isLight ? rgbStr(ct.ink) : '255,255,255',
      '--chromebg': isLight ? 'rgba(255,255,255,.82)' : 'rgba(' + rgbStr(darkBase) + ',.78)',
      '--railbg': isLight ? 'rgba(255,255,255,.92)' : 'rgba(' + rgbStr(mixHex(ct.bg,'#000000',.6)) + ',.88)',
      '--panelbg': isLight ? 'rgba(255,255,255,.95)' : 'rgba(' + rgbStr(mixHex(ct.bg,'#000000',.55)) + ',.93)'

    page: ct.bg,
    bg: `radial-gradient(120% 100% at 18% 8%, ${ct.glow} 0%, ${ct.bg} 45%, ${mixHex(ct.bg,'#000000', isLight ? .08 : .5)} 100%)`,

}

/* render one slide -> stage HTML */
function renderStage(slide, deck, extraClass, opts) {
  const o = opts || {};
  const lay = LAYOUTS[slide.layout] || LAYOUTS.statement;
  let eyebrow = null;
  if (slide.parentId) {
    const p = deck.slides.find(s => s.id === slide.parentId);
    if (p) eyebrow = plain(p.content.title || p.label || '');
  }
  let cueHtml = '';
  if (slide.cue && o.cue !== false) {
    cueHtml = `<div style="position:absolute;right:64px;bottom:${o.cueLift ? 114 : 44}px;max-width:560px;text-align:right;font-size:21px;font-style:italic;line-height:1.45;letter-spacing:.02em;color:rgba(var(--ink-rgb),.38);z-index:10;${an('fade',1.2,.9)}"><span style="font-style:normal;color:rgba(var(--acc-rgb),.5)">✎ </span>${rich(slide.cue)}</div>`;
  }
  /* deck-level organization mark (company name / disclaimer): left edge, above or below all layout content */
  let orgHtml = '';
  const org = deck.meta && deck.meta.org;
  if (org && !slide.hideOrg && o.org !== false) {
    const pos = (deck.settings && deck.settings.orgPos) === 'top' ? 'top:44px' : `bottom:${o.orgLift ? 114 : 44}px`;
    orgHtml = `<div class="fp orgmark" style="position:absolute;left:150px;${pos};max-width:1100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:20px;line-height:1.4;letter-spacing:.18em;text-transform:uppercase;color:rgba(var(--ink-rgb),.4);z-index:10">${rich(org)}</div>`;
  }
  return `<div class="stage ${extraClass||''}">${lay.render(slide.content || {}, eyebrow)}${orgHtml}${cueHtml}</div>`;
}

function slideTitle(s) {
  return s.label || plain((s.content && (s.content.title || s.content.kicker)) || '') || LAYOUTS[s.layout].name;
}

/* ---------------- deck model ---------------- */
function newSlide(layout) {
  return { id: uid(), layout, parentId: null, label:'', notes:'', cue:'', duration:'', hidden:false, hideOrg:false,
    content: JSON.parse(JSON.stringify(LAYOUTS[layout].defaults)) };
}
function newDeck(title) {
  return {
    id: uid(), version: 1,
    meta: { title: title || 'Untitled Deck', created: Date.now(), org: '' },
    theme: 'emerald',
    settings: { nav:'dots', showSkip:true, showCounter:false, transition:'fade', ambient:true, autoHideChrome:true, autoPlay:false, autoSeconds:8, autoLoop:false, targetMinutes:'', orgPos:'bottom' },
    slides: [ newSlide('hero'), newSlide('section'), newSlide('topics'), newSlide('closing') ]
  };
}
function validateDeck(d) {
  if (!d || typeof d !== 'object') throw new Error('Not an object.');
  if (!Array.isArray(d.slides)) throw new Error('Missing "slides" array.');
  if (!d.slides.length) throw new Error('Deck has no slides.');
  d.version = d.version || 1;
  d.id = d.id || uid();
  d.meta = Object.assign({ title:'Untitled Deck', created: Date.now(), org: '' }, d.meta);
  if (typeof d.meta.org !== 'string') d.meta.org = '';
  d.theme = (THEMES[d.theme] || d.theme === 'custom') ? d.theme : 'emerald';
  if (d.theme === 'custom') d.customTheme = Object.assign({}, DEFAULT_CUSTOM, d.customTheme || {});
  d.settings = Object.assign({ nav:'dots', showSkip:true, showCounter:false, transition:'fade', ambient:true, autoHideChrome:true, autoPlay:false, autoSeconds:8, autoLoop:false, targetMinutes:'', orgPos:'bottom' }, d.settings);
  if (d.settings.orgPos !== 'top') d.settings.orgPos = 'bottom';
  d.slides.forEach((s, i) => {
    if (!LAYOUTS[s.layout]) throw new Error(`Slide ${i+1}: unknown layout "${s.layout}".`);
    s.id = s.id || uid();
    s.content = Object.assign(JSON.parse(JSON.stringify(LAYOUTS[s.layout].defaults)), s.content || {});
    s.parentId = s.parentId || null;
    s.label = s.label || ''; s.notes = s.notes || ''; s.cue = s.cue || ''; s.duration = s.duration || ''; s.hidden = !!s.hidden; s.hideOrg = !!s.hideOrg;
  });
  return d;
}

/* ---------------- IndexedDB ---------------- */
const DB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('greenroom', 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('decks')) db.createObjectStore('decks', { keyPath:'id' });
      if (!db.objectStoreNames.contains('snaps')) db.createObjectStore('snaps', { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    put: rec => tx('decks', 'readwrite', st => st.put(rec)),
    get: id  => tx('decks', 'readonly',  st => st.get(id)),
    all: ()  => tx('decks', 'readonly',  st => st.getAll()),
    del: id  => tx('decks', 'readwrite', st => st.delete(id)),
    snapPut: rec => tx('snaps', 'readwrite', st => st.put(rec)),
    snapAll: ()  => tx('snaps', 'readonly',  st => st.getAll()),
    snapDel: id  => tx('snaps', 'readwrite', st => st.delete(id))
  };
})();

/* ---------------- app state ---------------- */
let deck = null;
let sel = 0;               // selected slide index (designer)
let cur = 0;               // current slide (present)
let mode = 'design';
let propTab = 'slide';
let saveState = 'saved';

const persist = debounce(async () => {
  try {
    await DB.put({ id: deck.id, json: JSON.stringify(deck), title: deck.meta.title, updated: Date.now() });
    localStorage.setItem('gr-current', deck.id);
    saveState = 'saved'; updateSaveDot();
  } catch (e) { saveState = 'error'; updateSaveDot(); console.error(e); }
}, 400);
/* undo/redo history: bursts of rapid edits (typing) collapse into one step */
let undoStack = [], redoStack = [], histLast = null, burstOpen = false;
const closeBurst = debounce(() => { histLast = JSON.stringify(deck); burstOpen = false; }, 700);
function resetHistory() { undoStack = []; redoStack = []; burstOpen = false; histLast = JSON.stringify(deck); }
function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(deck));
  deck = validateDeck(JSON.parse(undoStack.pop()));
  histLast = JSON.stringify(deck); burstOpen = false;
  sel = Math.min(sel, deck.slides.length - 1);
  saveState = 'saving'; persist();
  if (mode === 'design') renderDesign();
}
function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(deck));
  deck = validateDeck(JSON.parse(redoStack.pop()));
  histLast = JSON.stringify(deck); burstOpen = false;
  sel = Math.min(sel, deck.slides.length - 1);
  saveState = 'saving'; persist();
  if (mode === 'design') renderDesign();
}

function touch() {
  if (!burstOpen) {
    if (histLast !== null) {
      undoStack.push(histLast);
      if (undoStack.length > 100) undoStack.shift();
      redoStack = [];
    }
    burstOpen = true;
  }
  closeBurst();
  saveState = 'saving'; updateSaveDot(); persist();
}
function updateSaveDot() {
  const el = $('#savedot');
  if (el) el.textContent = saveState === 'saved' ? 'Saved' : saveState === 'saving' ? 'Saving…' : 'Save failed';
  const u = $('#undobtn'), r = $('#redobtn');
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}

function renderSlideList() {
  const host = $('#slidelist');
  host.innerHTML = deck.slides.map((s, i) => {
    const lay = LAYOUTS[s.layout];
    return `<div class="sl-item ${i===sel?'sel':''} ${s.parentId?'child':''} ${s.hidden?'hid':''}" draggable="true" data-idx="${i}">
      <div class="sl-num">${i+1}</div>
      <div class="sl-icon">${lay.icon}</div>
      <div class="sl-name">${esc(slideTitle(s))}<span class="sl-lay">${lay.name}${s.hidden?' · hidden':''}</span></div>
      <div class="sl-actions">
        <button class="mini" data-act="up" title="Move up">▴</button>
        <button class="mini" data-act="down" title="Move down">▾</button>
        <button class="mini" data-act="dup" title="Duplicate">⧉</button>
        <button class="mini" data-act="del" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('') + `<button class="addslide" data-act="add">+ Add slide</button>`;

  /* drag reorder */
  let dragIdx = null;
  $$('.sl-item', host).forEach(el => {
    el.addEventListener('dragstart', () => { dragIdx = +el.dataset.idx; });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('dragover');
      const to = +el.dataset.idx;
      if (dragIdx === null || dragIdx === to) return;
      const [m] = deck.slides.splice(dragIdx, 1);
      deck.slides.splice(to > dragIdx ? to - 1 : to, 0, m);
      sel = to > dragIdx ? to - 1 : to;
      touch(); renderSlideList(); renderProps(); renderPreview();
    });
  });
}

function moveSlide(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= deck.slides.length) return;
  [deck.slides[i], deck.slides[j]] = [deck.slides[j], deck.slides[i]];
  sel = j; touch(); renderSlideList(); renderPreview();
}

/* ---- properties panel ---- */
function renderProps() {
  const body = $('#propsbody');
  if (!body) return;
  if (propTab === 'deck') { body.innerHTML = deckSettingsHTML(); bindDeckSettings(body); return; }
  const s = deck.slides[sel];
  if (!s) { body.innerHTML = '<div class="pv-info">No slide selected.</div>'; return; }
  const lay = LAYOUTS[s.layout];
  const sections = deck.slides.filter(x => x.layout === 'section' && x.id !== s.id);
  let html = `
    <div class="sechead">${lay.icon} ${lay.name}</div>
    <div class="field"><label>Layout</label>
      <button type="button" class="btn layoutbtn" id="f-layout"><span>${lay.icon} ${lay.name}</span><span class="chg">Change…</span></button>
      <div class="hint">Opens a visual picker previewing this slide’s content in every layout.</div></div>
    <div class="field"><label>Slide label</label><input type="text" id="f-label" value="${esc(s.label)}" placeholder="${esc(slideTitle(s))}">
      <div class="hint">Shown in the slide list and thumbnail rail.</div></div>
    <div class="field"><label>Parent section</label>
      <select id="f-parent"><option value="">— none —</option>${sections.map(p => `<option value="${p.id}" ${p.id===s.parentId?'selected':''}>${esc(slideTitle(p))}</option>`).join('')}</select>
      <div class="hint">Children show the section’s name as an eyebrow label and group under it in the rail.</div></div>
    <div class="divider"></div>`;
  html += lay.fields.map(f => fieldHTML(f, s.content[f.k])).join('');
  html += `<div class="divider"></div>
    <div class="field"><label>Presenter cue</label><input type="text" id="f-cue" value="${esc(s.cue)}" placeholder="e.g. Tell the airport anecdote" maxlength="90">
      <div class="hint">A short reminder shown small and faint at the slide's bottom-right the whole time it's on screen — a nudge for you, unobtrusive to the audience. Left out of Print/PDF.</div></div>
    <div class="field"><label>Speaker notes</label><textarea id="f-notes" rows="4">${esc(s.notes)}</textarea>
      <div class="hint">Press N while presenting to show/hide notes.</div></div>
    <div class="field"><label>Autoplay duration (seconds, optional)</label><input type="number" class="in" id="f-duration" min="1" max="600" value="${esc(s.duration)}" placeholder="deck default">
      <div class="hint">Only used in autoplay mode — overrides the deck’s seconds-per-slide for this slide.</div></div>
    <div class="field"><label class="checkrow"><input type="checkbox" id="f-hidden" ${s.hidden?'checked':''}> Hide in presentation (backup slide)</label>
      <div class="hint">Stays in the deck and designer, but navigation, autoplay, and Print/PDF skip it — perfect for appendix slides you only show if asked.</div></div>
    <div class="field"><label class="checkrow"><input type="checkbox" id="f-hideorg" ${s.hideOrg?'checked':''}> Hide organization mark on this slide</label>
      <div class="hint">For title and closing slides that already carry the organization name. The mark itself is set in the Deck tab.</div></div>`;
  body.innerHTML = html;
  bindSlideProps(body, s);
}

function fieldHTML(f, val) {
  const id = 'fc-' + f.k;
  if (f.type === 'text')
    return `<div class="field"><label>${f.label}</label><input type="text" id="${id}" data-k="${f.k}" value="${esc(val)}">${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  if (f.type === 'area')
    return `<div class="field"><label>${f.label}</label><textarea id="${id}" data-k="${f.k}" rows="${f.rows||3}">${esc(val)}</textarea>${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  if (f.type === 'select')
    return `<div class="field"><label>${f.label}</label><select id="${id}" data-k="${f.k}">${f.opts.map(o => `<option value="${o[0]}" ${o[0]===val?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  if (f.type === 'check')
    return `<div class="field"><label class="checkrow"><input type="checkbox" id="${id}" data-k="${f.k}" ${val?'checked':''}> ${f.label}</label></div>`;
  if (f.type === 'image')
    return `<div class="field imgfield"><label>${f.label}</label>
      ${val ? `<img src="${esc(val)}"><button class="btn small danger" data-imgclear="${f.k}">Remove image</button>`
            : `<input type="file" accept="image/*" data-imgpick="${f.k}" class="in">`}
      <div class="hint">Embedded into the deck JSON as base64 — the deck stays a single portable file.</div></div>`;
  if (f.type === 'video')
    return `<div class="field imgfield"><label>${f.label}</label>
      ${val ? `<video src="${esc(val)}" controls style="max-width:100%;border-radius:8px;border:1px solid rgba(227,197,103,.25);display:block;margin-bottom:7px"></video>
               <button class="btn small danger" data-vidclear="${f.k}">Remove video (~${Math.round(val.length * 3 / 4 / 1024 / 102.4) / 10} MB)</button>`
            : `<input type="file" accept="video/mp4,video/webm" data-vidpick="${f.k}" class="in">`}
      <div class="hint">Embedded as base64 — the deck stays one portable file, but grows by the clip size. Keep clips short.</div></div>`;
  if (f.type === 'list') {
    const items = val || [];
    return `<div class="field"><label>${f.label}</label><div class="listbox" data-list="${f.k}">
      ${items.map((it, i) => `<div class="listitem">
        <div class="li-head"><span class="li-title">${f.itemName||'Item'} ${i+1}</span>
          <span>
            <button class="mini" data-liup="${f.k}:${i}">▴</button>
            <button class="mini" data-lidown="${f.k}:${i}">▾</button>
            <button class="mini" data-lidel="${f.k}:${i}">✕</button>
          </span></div>
        ${f.fields.map(sf => subFieldHTML(f.k, i, sf, it[sf.k])).join('')}
      </div>`).join('')}
      ${items.length < (f.max||9) ? `<button class="btn small" data-liadd="${f.k}">+ Add ${f.itemName||'item'}</button>` : ''}
    </div></div>`;
  }
  return '';
}
function subFieldHTML(listK, i, sf, val) {
  const d = `data-sub="${listK}:${i}:${sf.k}"`;
  if (sf.type === 'area')  return `<div class="field"><label>${sf.label}</label><textarea ${d} rows="2">${esc(val)}</textarea></div>`;
  if (sf.type === 'select')return `<div class="field"><label>${sf.label}</label><select ${d}>${sf.opts.map(o=>`<option value="${o[0]}" ${o[0]===val?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  if (sf.type === 'check') return `<div class="field"><label class="checkrow"><input type="checkbox" ${d} ${val?'checked':''}> ${sf.label}</label></div>`;
  return `<div class="field"><label>${sf.label}</label><input type="text" ${d} value="${esc(val)}"></div>`;
}

const previewSoon = debounce(() => { renderPreview(false); }, 160);
const listSoon = debounce(() => renderSlideList(), 400);

function bindSlideProps(body, s) {
  $('#f-layout', body).addEventListener('click', () => layoutPicker(true));
  $('#f-label', body).addEventListener('input', e => { s.label = e.target.value; touch(); listSoon(); });
  $('#f-parent', body).addEventListener('change', e => { s.parentId = e.target.value || null; touch(); renderSlideList(); renderPreview(); });
  $('#f-notes', body).addEventListener('input', e => { s.notes = e.target.value; touch(); });
  $('#f-cue', body).addEventListener('input', e => { s.cue = e.target.value; touch(); previewSoon(); });
  $('#f-duration', body).addEventListener('input', e => { s.duration = e.target.value; touch(); });
  $('#f-hidden', body).addEventListener('change', e => { s.hidden = e.target.checked; touch(); renderSlideList(); });
  $('#f-hideorg', body).addEventListener('change', e => { s.hideOrg = e.target.checked; touch(); previewSoon(); });

  $$('[data-k]', body).forEach(el => {
    const f = LAYOUTS[s.layout].fields.find(x => x.k === el.dataset.k);
    if (!f || f.type === 'list') return;
    const ev = (f.type === 'select' || f.type === 'check') ? 'change' : 'input';
    el.addEventListener(ev, () => {
      s.content[f.k] = f.type === 'check' ? el.checked : el.value;
      touch(); previewSoon(); listSoon();
    });
  });
  $$('[data-sub]', body).forEach(el => {
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const [lk, i, sk] = el.dataset.sub.split(':');
      const item = s.content[lk][+i];
      item[sk] = el.type === 'checkbox' ? el.checked : el.value;
      touch(); previewSoon();
    });
  });
  const rerenderList = () => { touch(); renderProps(); renderPreview(); };
  $$('[data-liadd]', body).forEach(el => el.addEventListener('click', () => {
    const f = LAYOUTS[s.layout].fields.find(x => x.k === el.dataset.liadd);
    const item = {}; f.fields.forEach(sf => item[sf.k] = sf.type === 'check' ? false : (sf.type === 'select' ? sf.opts[0][0] : ''));
    (s.content[f.k] = s.content[f.k] || []).push(item); rerenderList();
  }));
  $$('[data-lidel]', body).forEach(el => el.addEventListener('click', () => {
    const [k, i] = el.dataset.lidel.split(':'); s.content[k].splice(+i, 1); rerenderList();
  }));
  $$('[data-liup]', body).forEach(el => el.addEventListener('click', () => {
    const [k, i] = el.dataset.liup.split(':'); const a = s.content[k], j = +i;
    if (j > 0) { [a[j-1], a[j]] = [a[j], a[j-1]]; rerenderList(); }
  }));
  $$('[data-lidown]', body).forEach(el => el.addEventListener('click', () => {
    const [k, i] = el.dataset.lidown.split(':'); const a = s.content[k], j = +i;
    if (j < a.length - 1) { [a[j+1], a[j]] = [a[j], a[j+1]]; rerenderList(); }
  }));
  $$('[data-imgpick]', body).forEach(el => el.addEventListener('change', () => {
    const file = el.files && el.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      s.content[el.dataset.imgpick] = rd.result;
      touch(); renderProps(); renderPreview();
    };
    rd.readAsDataURL(file);
  }));
  $$('[data-imgclear]', body).forEach(el => el.addEventListener('click', () => {
    s.content[el.dataset.imgclear] = ''; touch(); renderProps(); renderPreview();
  }));
  $$('[data-vidpick]', body).forEach(el => el.addEventListener('change', () => {
    const file = el.files && el.files[0]; if (!file) return;
    if (file.size > 25 * 1024 * 1024 && !confirm(`This clip is ${Math.round(file.size/1024/1024)} MB — the deck file grows by that much. Embed anyway?`)) { el.value = ''; return; }
    const rd = new FileReader();
    rd.onload = () => { s.content[el.dataset.vidpick] = rd.result; touch(); renderProps(); renderPreview(); };
    rd.readAsDataURL(file);
  }));
  $$('[data-vidclear]', body).forEach(el => el.addEventListener('click', () => {
    s.content[el.dataset.vidclear] = ''; touch(); renderProps(); renderPreview();
  }));
}

function bindDeckSettings(body) {
  const st = deck.settings;
  $('#d-theme', body).addEventListener('click', () => themePickerModal());
  $$('[data-ctcolor]', body).forEach(el => el.addEventListener('input', () => {
    deck.customTheme = deck.customTheme || Object.assign({}, DEFAULT_CUSTOM);
    deck.customTheme[el.dataset.ctcolor] = el.value;
    touch(); previewSoon();
  }));
  $('#d-org', body).addEventListener('input', e => { deck.meta.org = e.target.value; touch(); previewSoon(); });
  $('#d-orgpos', body).addEventListener('change', e => { st.orgPos = e.target.value; touch(); previewSoon(); });
  $('#d-nav', body).addEventListener('change', e => { st.nav = e.target.value; touch(); });
  $('#d-tr', body).addEventListener('change', e => { st.transition = e.target.value; touch(); });
  [['#d-skip','showSkip'],['#d-counter','showCounter'],['#d-amb','ambient'],['#d-hide','autoHideChrome'],['#d-auto','autoPlay'],['#d-autoloop','autoLoop']].forEach(([selr, k]) => {
    $(selr, body).addEventListener('change', e => { st[k] = e.target.checked; touch(); });
  });
  $('#d-autosec', body).addEventListener('input', e => {
    const n = parseFloat(e.target.value);
    if (n >= 2 && n <= 600) { st.autoSeconds = n; touch(); }
  });
  $('#d-target', body).addEventListener('input', e => { st.targetMinutes = e.target.value; touch(); });
}

/* ---- live preview ---- */
function renderPreview(refit) {
  const box = $('#pvbox'), canvas = $('#pvcanvas');
  if (!box) return;
  const s = deck.slides[sel];
  const t = theme(deck);
  box.style.background = t.bg;
  box.innerHTML = `<div style="position:absolute;inset:0;${themeVarStyle(t)}">
    ${deck.settings.ambient ? `<div class="amb">${t.ambient()}</div>` : ''}
    ${s ? renderStage(s, deck) : ''}
  </div>`;
  fitPreview();
  const info = $('#pvinfo');
  if (info && s) info.textContent = `Slide ${sel+1} of ${deck.slides.length}`;
  requestAnimationFrame(() => {
    const st = $('#pvbox .stage'), warn = $('#ovwarn');
    if (st && warn) warn.style.display = (st.scrollHeight > 1092 || st.scrollWidth > 1932) ? '' : 'none';
  });
}
function fitPreview() {
  const box = $('#pvbox'), canvas = $('#pvcanvas');
  if (!box || !canvas) return;
  const r = canvas.getBoundingClientRect();
  const sc = Math.min(r.width / 1920, r.height / 1080) * 0.94;
  box.style.transform = `translate(-50%,-50%) scale(${sc})`;
}
window.addEventListener('resize', () => { if (mode === 'design') fitPreview(); });

/* ---- modals ---- */
function modal(html, wide) {
  const host = $('#modalhost');
  host.innerHTML = `<div class="modalback" data-close="1"><div class="modal${wide ? ' wide' : ''}">${html}</div></div>`;
  $('.modalback', host).addEventListener('mousedown', e => { if (e.target.dataset.close) closeModal(); });
  return host;
}
function closeModal() { const h = $('#modalhost'); if (h) h.innerHTML = ''; }

/* pour one layout's content into another: matching fields carry over, list items
   bridge title<->text shapes, everything else starts from the target's defaults */
function mapContent(old, k) {
  const out = JSON.parse(JSON.stringify(LAYOUTS[k].defaults));
  for (const f of LAYOUTS[k].fields) {
    if (!(f.k in old)) continue;
    if (f.type === 'list') {
      const subKeys = f.fields.map(sf => sf.k);
      const mapped = (old[f.k] || []).map(it => {
        const o = {};
        for (const sk of subKeys) if (it[sk] !== undefined) o[sk] = it[sk];
        if (o.text === undefined && subKeys.includes('text') && typeof it.title === 'string')
          o.text = it.title + (it.sub ? ' — ' + it.sub : '');
        if (o.title === undefined && subKeys.includes('title') && typeof it.text === 'string')
          o.title = it.text;
        return o;
      }).filter(o => Object.values(o).some(v => v !== '' && v !== undefined && v !== false));
      if (mapped.length) out[f.k] = mapped.slice(0, f.max || 9);
    } else if ((f.type === 'image' && String(old[f.k]).startsWith('data:video')) ||
               (f.type === 'video' && String(old[f.k]).startsWith('data:image'))) {
      /* don't pour an image into a video slot or vice versa */
    } else {
      out[f.k] = old[f.k];
    }
  }
  return out;
}

function applyLayoutChange(s, k) {
  s.content = mapContent(s.content, k);
  s.layout = k;
  touch();
}

/* visual layout cards: preview each layout with the given content (or its defaults) */
function layoutCardsHTML(contentBase, currentLayout) {
  const t = theme(deck);
  return `<div class="laygrid">` + Object.entries(LAYOUTS).map(([k, v]) => {
    const preview = contentBase ? mapContent(contentBase, k) : JSON.parse(JSON.stringify(v.defaults));
    const fake = { id:'preview', layout:k, parentId:null, label:'', notes:'', cue:'', content: preview };
    return `<div class="laycard ${k===currentLayout?'current':''}" data-lay="${k}">
      <div class="laythumb"><div class="lt-stage" style="background:${t.bg};${themeVarStyle(t)}">${renderStage(fake, deck, 'static', { cue:false })}</div></div>
      <div class="ln">${v.icon} ${v.name}${k===currentLayout?'<span class="cur-tag">current</span>':''}</div>
      <div class="ld">${v.desc}</div>
    </div>`;
  }).join('') + `</div>`;
}
function fitLayoutThumbs(host) {
  requestAnimationFrame(() => {
    $$('.lt-stage', host).forEach(el => {
      const w = el.parentElement.getBoundingClientRect().width;
      if (w) el.style.transform = `scale(${w / 1920})`;
    });
  });
}

function layoutPicker(switchMode) {
  const s = switchMode ? deck.slides[sel] : null;
  const host = modal(`<h3>${switchMode ? 'Change slide layout' : 'Add a slide'}</h3>
    ${switchMode ? `<div class="pickhint">Each preview shows this slide’s own content poured into that layout — matching fields carry over, the rest start from defaults.</div>` : ''}
    ${layoutCardsHTML(s ? s.content : null, s ? s.layout : null)}
    <div class="mrow"><button class="btn" data-close="1">Cancel</button></div>`, true);
  fitLayoutThumbs(host);
  $$('.laycard', host).forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.lay;
    if (switchMode) {
      if (k !== s.layout) applyLayoutChange(s, k);
      closeModal(); renderSlideList(); renderProps(); renderPreview();
    } else {
      const ns = newSlide(k);
      deck.slides.splice(sel + 1, 0, ns);
      sel = sel + 1;
      closeModal(); touch(); renderSlideList(); renderProps(); renderPreview();
    }
  }));
}

/* ---- visual theme picker ---- */
function themePickerModal() {
  const s = deck.slides[sel] || deck.slides[0];
  const entries = Object.entries(THEMES).map(([k, v]) => [k, v])
    .concat([['custom', customThemeObj(Object.assign({}, DEFAULT_CUSTOM, deck.customTheme || {}))]]);
  const host = modal(`<h3>Choose a theme</h3>
    <div class="pickhint">Each card previews your current slide in that theme. “Custom colors” gets five swatches in the Deck tab.</div>
    <div class="laygrid">${entries.map(([k, T]) => `
      <div class="laycard ${k===deck.theme?'current':''}" data-theme="${k}">
        <div class="laythumb"><div class="lt-stage" style="background:${T.bg};${themeVarStyle(T)}">${renderStage(s, deck, 'static', { cue:false })}</div></div>
        <div class="ln">${k==='custom' ? '🎨 Custom colors…' : esc(T.name)}${k===deck.theme?'<span class="cur-tag">current</span>':''}</div>
      </div>`).join('')}</div>
    <div class="mrow"><button class="btn" data-close="1">Cancel</button></div>`, true);
  fitLayoutThumbs(host);
  $$('[data-theme]', host).forEach(el => el.addEventListener('click', () => {
    deck.theme = el.dataset.theme;
    if (deck.theme === 'custom' && !deck.customTheme) deck.customTheme = Object.assign({}, DEFAULT_CUSTOM);
    touch(); closeModal(); renderProps(); renderPreview();
  }));
}

/* ---- slide sorter (designer) ---- */
function sorterCardsHTML(indices, current, positions) {

function sorterModal() {
  const host = modal(`<h3>Slide sorter</h3>
    <div class="pickhint">Drag cards to reorder. Click a slide to select it and return to editing.</div>
    <div id="sortbody">${sorterCardsHTML(deck.slides.map((_, i) => i), sel)}</div>
    <div class="mrow"><button class="btn primary" data-close="1">Done</button></div>`, true);
  $('.modal', host).classList.add('xwide');
  const bind = () => {
    fitLayoutThumbs(host);
    let dragIdx = null, dragged = false;
    $$('.sortcard', host).forEach(el => {
      el.addEventListener('dragstart', () => { dragIdx = +el.dataset.si; dragged = true; });
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
      el.addEventListener('dragleave', () => el.classList.remove('dragover'));
      el.addEventListener('drop', e => {
        e.preventDefault(); el.classList.remove('dragover');
        const to = +el.dataset.si;
        if (dragIdx === null || dragIdx === to) return;
        const [m] = deck.slides.splice(dragIdx, 1);
        deck.slides.splice(to > dragIdx ? to - 1 : to, 0, m);
        sel = to > dragIdx ? to - 1 : to;
        touch(); renderSlideList(); renderPreview();
        $('#sortbody', host).innerHTML = sorterCardsHTML(deck.slides.map((_, i) => i), sel);
        bind();
      });
      el.addEventListener('click', () => {
        if (dragged) { dragged = false; return; }
        sel = +el.dataset.si;
        closeModal(); renderSlideList(); renderProps(); renderPreview();
      });
    });
  };
  bind();
}

/* ---- search across slides (Ctrl+F) ---- */
function slideStrings(s) {
  const out = [s.label, s.notes, s.cue];
  (function walk(v) {
    if (typeof v === 'string') { if (!v.startsWith('data:')) out.push(v); }
    else if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') Object.values(v).forEach(walk);
  })(s.content);
  return out.filter(Boolean);
}
function searchModal() {
  const host = modal(`<h3>Find in deck</h3>
    <input type="text" class="in" id="searchin" placeholder="Search titles, body text, notes, cues…" autocomplete="off">
    <div id="searchres" style="margin-top:12px;display:flex;flex-direction:column;gap:6px"></div>
    <div class="mrow"><button class="btn" data-close="1">Close</button></div>`);
  const inp = $('#searchin', host);
  const run = () => {
    const q = inp.value.trim().toLowerCase();
    const res = $('#searchres', host);
    if (!q) { res.innerHTML = ''; return; }
    const hits = [];
    deck.slides.forEach((s, i) => {
      const m = slideStrings(s).find(t => t.toLowerCase().includes(q));
      if (m) {
        const at = m.toLowerCase().indexOf(q);
        const snip = (at > 25 ? '…' : '') + m.slice(Math.max(0, at - 25), at + q.length + 45);
        hits.push({ i, snip });
      }
    });
    res.innerHTML = hits.length
      ? hits.map(h => `<div class="deckrow" data-goto="${h.i}" style="cursor:pointer"><div class="dr-name">${h.i+1} · ${esc(slideTitle(deck.slides[h.i]))}</div><div class="dr-date">${esc(plain(h.snip))}</div></div>`).join('')
      : '<div class="pv-info">No matches.</div>';
    $$('[data-goto]', res).forEach(el => el.addEventListener('click', () => {
      sel = +el.dataset.goto;
      closeModal(); renderSlideList(); renderProps(); renderPreview();
    }));
  };
  inp.addEventListener('input', run);
  inp.focus();
}

function jsonModal() {
  const host = modal(`<h3>Deck JSON</h3>
    <textarea class="jsonarea" id="jsontext" spellcheck="false">${esc(JSON.stringify(deck, null, 2))}</textarea>
    <div class="err" id="jsonerr"></div>
    <div class="mrow">
      <button class="btn" data-a="copy">Copy</button>
      <button class="btn primary" data-a="apply">Apply changes</button>
      <button class="btn" data-a="close">Close</button>
    </div>`);
  host.querySelector('[data-a=copy]').addEventListener('click', () => {
    navigator.clipboard && navigator.clipboard.writeText($('#jsontext').value);
  });
  host.querySelector('[data-a=close]').addEventListener('click', closeModal);
  host.querySelector('[data-a=apply]').addEventListener('click', () => {
    try {
      const d = validateDeck(JSON.parse($('#jsontext').value));
      d.id = deck.id;                 // applying JSON edits the open deck
      deck = d; sel = Math.min(sel, deck.slides.length - 1);
      touch(); closeModal(); renderDesign();
    } catch (e) { $('#jsonerr').textContent = 'Invalid deck JSON: ' + e.message; }
  });
}

/* ---- AI helper prompt ---- */
function fieldDoc(f, indent) {
  let type = 'string';
  if (f.type === 'list') type = `array of objects, max ${f.max || 9}`;
  else if (f.type === 'check') type = 'boolean';
  else if (f.type === 'select') type = 'one of: ' + f.opts.map(o => JSON.stringify(o[0])).join(' | ');
  else if (f.type === 'image') type = 'string — ALWAYS use "" (images are added later, inside the app)';
  else if (f.type === 'video') type = 'string — ALWAYS use "" (video is added later, inside the app)';
  let line = `${indent}"${f.k}" (${type}) — ${f.label}${f.hint && f.type !== 'image' ? '. ' + f.hint : ''}`;
  if (f.type === 'list') line += ', each item has:\n' + f.fields.map(sf => fieldDoc(sf, indent + '    ')).join('\n');
  return line;
}

function buildHelperPrompt() {
  const layoutDocs = Object.entries(LAYOUTS).map(([k, v]) =>
    `- "${k}" (${v.name}): ${v.desc} Content fields:\n` + v.fields.map(f => fieldDoc(f, '    ')).join('\n')
  ).join('\n');
  const themeNames = Object.keys(THEMES).map(t => JSON.stringify(t)).join(' | ');
  const example = {
    version: 1,
    meta: { title: 'Quarterly Kickoff', org: 'Acme Corp · Internal' },
    theme: 'emerald',
    settings: { nav: 'dots', showSkip: true, showCounter: true, transition: 'fade', ambient: true, autoHideChrome: true },
    slides: [
      { id: 's1', layout: 'hero', parentId: null, label: 'Intro', notes: 'Welcome everyone, wait for the room to fill.', hideOrg: true,
        content: { kicker: 'Team All-Hands', title: 'Quarterly\n[[Kickoff]]', badge: 'Questions welcome at any time' } },
      { id: 's2', layout: 'topics', parentId: null, label: 'Agenda', notes: '',
        content: { title: 'Today’s [[Agenda]]', items: [ { title: 'Where we landed', sub: 'Q2 results' }, { title: 'Where we’re going', sub: 'Q3 plan' } ] } },
      { id: 's3', layout: 'section', parentId: null, label: 'Results splash', notes: '',
        content: { kicker: 'Part One', title: 'Q2 [[Results]]', subtitle: 'The numbers and the story behind them', ghost: '01' } },
      { id: 's4', layout: 'statement', parentId: 's3', label: 'Headline result', notes: 'Pause here. Let it land.', cue: 'Tell the Meridian win story',
        content: { title: 'The headline', body: 'Revenue grew [[18%]] quarter over quarter.', punch: 'Our best quarter yet.' } },
      { id: 's5', layout: 'closing', parentId: null, label: 'Thanks', notes: '',
        content: { title: 'Thank you!', kicker: 'Up Next', tease: 'Q3 Planning Week', badge: 'Slides and recording will be shared after' } }
    ]
  };
  return `You are helping me turn my rough outline into a slide deck for Greenroom, a JSON-driven presentation tool. Read my outline (pasted at the bottom) and produce a complete Greenroom deck JSON I can import.

OUTPUT RULES
- Reply with ONE valid JSON object and nothing else: no markdown code fences, no commentary before or after.
- Inside JSON strings, use \\n for a line break (never a raw newline).
- Give every slide a unique "id" (s1, s2, s3, ...). Do not reuse ids.

DECK STRUCTURE
{
  "version": 1,
  "meta": { "title": "<deck title>", "org": "<organization mark or ''>" },
  "theme": ${themeNames} | "custom",
  "customTheme": { "bg":"#0B2318", "glow":"#17402C", "ink":"#F4F1E9", "acc":"#E3C567", "acc2":"#DE6B2C" }   (hex colors; ONLY when theme is "custom" — e.g. to match my brand colors if my outline mentions them),
  "settings": {
    "nav": "dots" | "thumbs"        (bottom dot navigation, or a left thumbnail rail),
    "showSkip": true|false          (show a Skip-to-end button),
    "showCounter": true|false       (show a "3 / 12" slide counter),
    "transition": "fade" | "slide" | "zoom" | "none",
    "ambient": true|false           (animated background particles),
    "autoHideChrome": true|false    (navigation fades out when idle),
    "autoPlay": true|false          (kiosk mode: slides advance automatically),
    "autoSeconds": 8                (autoplay: seconds per slide),
    "autoLoop": true|false,         (autoplay: loop back to the first slide)
    "orgPos": "bottom" | "top"      (where the organization mark sits: bottom-left below all content, or top-left above it)
  },
  "slides": [ <slide objects in presentation order> ]
}

- "meta.org": optional organization mark — a short company name, disclaimer, or copyright line (max ~50 characters, e.g. "Acme Corp · Confidential") rendered small and faint on the left edge of every slide. Fill it in when my outline names the organization or asks for a footer/disclaimer; otherwise use "".

SLIDE OBJECT
{ "id": "s1", "layout": "<layout name>", "parentId": null, "label": "<short name>", "notes": "<speaker notes>", "cue": "<tiny on-slide reminder or ''>", "content": { <layout-specific fields> } }
- "parentId": to group a slide under a section, set it to the id of an earlier "section" slide. Child slides automatically display that section's name as a small eyebrow label and nest under it in the thumbnail rail. Section splashes and standalone slides use null.
- "label": short name shown in the slide list and thumbnails (2-4 words).
- "notes": private speaker notes, shown only to the presenter on demand. Put my supporting detail and talking points here instead of crowding the slide.
- "duration": optional number — in autoplay mode, how many seconds this slide stays (omit to use settings.autoSeconds).
- "hidden": optional true — a backup/appendix slide: kept in the deck but skipped during the presentation and in print. Use for detail slides only shown if asked.
- "hideOrg": optional true — suppress the deck's organization mark on this slide. Set it on the hero/title and closing slides when they already state the organization name.
- "cue": optional presenter nudge (max ~8 words, e.g. "Tell the onboarding anecdote"), rendered small and faint at the slide's bottom-right the whole time the slide is up. Unlike "notes" it stays on screen, so keep it terse and non-sensitive. Use "" when not needed. If my outline mentions an aside, story, demo, or "remember to...", that belongs in "cue".

TEXT MARKUP (works in any content text field)
- [[text]] renders in the theme's gold accent color - use on 1-3 key words of a title.
- {{text}} renders in the theme's orange accent color - use sparingly for warnings/punch.
- [link text](https://example.com) renders as a clickable link that opens in a new tab. Use only where my outline includes a URL.
- \\n creates a line break (useful to split a long title across two lines).

LAYOUTS (choose the best-fitting layout per slide; "content" holds exactly these fields)
${layoutDocs}

DESIGN GUIDANCE
- Slides are static (no click-to-reveal), so keep each slide to ONE idea. Headlines short and punchy; body text 1-3 sentences maximum. Move detail into "notes".
- Typical flow: hero (title slide) -> topics (agenda) -> a "section" splash per major segment (ghost "01", "02", ... and kicker "Part One", "Part Two", ...) with that segment's detail slides as its children via parentId -> closing.
- Vary layouts across the deck. Use "statement" for one big message, "callout" right before a demo or discussion, "compare" for 2-3 side-by-side ideas, "bullets" only when a list is genuinely needed (max ~5 bullets).
- If my outline references a screenshot, chart, or picture, use the "image" layout with "src": "" - I will attach the actual image inside the app.
- If my outline is thin in places, make reasonable choices and keep going; I will refine everything in the app afterwards.

EXAMPLE OF A VALID DECK (structure reference - do not copy its content)
${JSON.stringify(example, null, 2)}

MY OUTLINE / NOTES / THOUGHTS:
<paste your outline below this line>
`;
}

      <button class="btn primary" data-a="new">+ New deck</button>
      <button class="btn" data-a="close">Close</button>
    </div>`);
  host.querySelector('[data-a=close]').addEventListener('click', closeModal);
  host.querySelector('[data-a=new]').addEventListener('click', () => {
    deck = newDeck(); sel = 0; touch(); resetHistory(); closeModal(); renderDesign();
  });
  host.querySelector('[data-a=sample]').addEventListener('click', () => {
    deck = validateDeck(sampleDeck()); sel = 0; touch(); resetHistory(); closeModal(); renderDesign();
  });
  $$('[data-open]', host).forEach(el => el.addEventListener('click', async () => {
    const rec = await DB.get(el.dataset.open);
    if (rec) { deck = validateDeck(JSON.parse(rec.json)); sel = 0; resetHistory(); localStorage.setItem('gr-current', deck.id); closeModal(); renderDesign(); }
  }));
  $$('[data-del]', host).forEach(el => el.addEventListener('click', async () => {
    if (!confirm('Delete this deck permanently?')) return;
    await DB.del(el.dataset.del);
    if (el.dataset.del === deck.id) { deck = newDeck(); sel = 0; touch(); resetHistory(); }
    closeModal(); decksModal();
  }));
  host.querySelector('[data-a=snap]').addEventListener('click', async () => {
    const name = $('#snapname', host).value.trim() || 'Snapshot ' + fmtDate(Date.now());
    try {
      await DB.snapPut({ id: uid(), deckId: deck.id, name, json: JSON.stringify(deck), created: Date.now() });
      closeModal(); decksModal();
    } catch (e) { alert('Could not save the snapshot: ' + e.message); }
  });
  $$('[data-restore]', host).forEach(el => el.addEventListener('click', async () => {
    const snap = snaps.find(s => s.id === el.dataset.restore);
    if (!snap || !confirm(`Restore "${snap.name}"? The current state is replaced (Ctrl+Z can bring it back).`)) return;
    const d = validateDeck(JSON.parse(snap.json));
    d.id = deck.id;
    deck = d; sel = Math.min(sel, deck.slides.length - 1);
    touch(); closeModal(); renderDesign();
  }));
  $$('[data-snapdel]', host).forEach(el => el.addEventListener('click', async () => {
    await DB.snapDel(el.dataset.snapdel);
    closeModal(); decksModal();
  }));
}

/* ---- import / export ---- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(deck, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (deck.meta.title || 'deck').replace(/[^\w\- ]+/g,'').trim().replace(/ +/g,'-').toLowerCase() + '.greenroom.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* Publish Player: serialize this app with the deck baked in, locked to present mode */
function exportPlayer() {
  const clone = document.documentElement.cloneNode(true);
  const app = clone.querySelector('#app'); if (app) app.innerHTML = '';
  const stale = clone.querySelector('#baked-deck'); if (stale) stale.remove();
  const json = JSON.stringify(deck).replace(/<\//g, '<\\/');
  const baked = '<scr' + 'ipt type="application/json" id="baked-deck">' + json + '</scr' + 'ipt>';
  let html = clone.outerHTML;
  const headEnd = html.indexOf('</head>');
  if (headEnd < 0) { alert('Could not build the player file.'); return; }
  html = '<!DOCTYPE html>\n' + html.slice(0, headEnd) + baked + html.slice(headEnd);
  const blob = new Blob([html], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (deck.meta.title || 'deck').replace(/[^\w\- ]+/g,'').trim().replace(/ +/g,'-').toLowerCase() + '.player.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = validateDeck(JSON.parse(rd.result));
        const host = modal(`<h3>Import “${esc(d.meta.title)}”</h3>
          <p style="font-size:13.5px;color:rgba(232,230,223,.75)">${d.slides.length} slide${d.slides.length===1?'':'s'}. How should it come in?</p>
          <div class="mrow">
            <button class="btn" data-a="cancel">Cancel</button>
            <button class="btn" data-a="append">Append to current deck</button>
            <button class="btn primary" data-a="new">Open as new deck</button>
          </div>`);
        host.querySelector('[data-a=cancel]').addEventListener('click', closeModal);
        host.querySelector('[data-a=new]').addEventListener('click', () => {
          d.id = uid();
          deck = d; sel = 0;
          closeModal(); touch(); resetHistory(); renderDesign();
        });
        host.querySelector('[data-a=append]').addEventListener('click', () => {
          const idMap = {};
          d.slides.forEach(s => { idMap[s.id] = uid(); s.id = idMap[s.id]; });
          d.slides.forEach(s => { s.parentId = idMap[s.parentId] || null; });
          sel = deck.slides.length;
          deck.slides.push(...d.slides);
          closeModal(); touch(); renderDesign();
        });
      } catch (e) { alert('Could not import: ' + e.message); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------------- present mode ---------------- */
/* indices of slides shown in the presentation (all, if every slide is hidden) */
function visIdx() {
  const v = deck.slides.map((s, i) => s.hidden ? null : i).filter(i => i !== null);
  return v.length ? v : deck.slides.map((_, i) => i);
}
function navStep(d) {
  const v = visIdx();
  let p = v.indexOf(cur);
  if (p < 0) { p = v.findIndex(i => i > cur); if (p < 0) p = v.length - 1; if (d > 0) p--; }
  goTo(v[Math.max(0, Math.min(v.length - 1, p + d))]);
}
let chromeTimer = null, notesOn = false, helpOn = false, railOverride = null;
let hudOn = false, hudStart = 0, hudInterval = null;
let autoRun = false, autoTimer = null;
let laserOn = false, drawOn = false;
let gridOn = false, blackOn = false, jumpBuf = '', jumpTimer = null;
let recOn = false, recTimes = null, recMark = 0;

function renderPGrid() {
  const el = $('#pgrid'); if (!el) return;
  if (!gridOn) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  el.innerHTML = sorterCardsHTML(visIdx(), cur, true);
  fitLayoutThumbs(el);
  $$('.sortcard', el).forEach(c => c.addEventListener('click', () => {
    gridOn = false; renderPGrid(); goTo(+c.dataset.si);
  }));
}
function renderJumpInd() {
  const el = $('#jumpind'); if (!el) return;
  el.style.display = jumpBuf ? '' : 'none';
  el.textContent = '→ ' + jumpBuf;
}
function commitJump() {
  const v = visIdx();
  const n = parseInt(jumpBuf, 10);
  jumpBuf = ''; renderJumpInd();
  if (n >= 1 && n <= v.length) goTo(v[n - 1]);
}
function updateBlack() {
  const el = $('#blackout'); if (el) el.style.display = blackOn ? '' : 'none';
}
function recLog() {
  if (!recOn || !recTimes) return;
  const id = deck.slides[cur].id;
  recTimes.set(id, (recTimes.get(id) || 0) + (Date.now() - recMark));
  recMark = Date.now();
}
function fmtMs(ms) {
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function showRecap() {
  const el = $('#recap'); if (!el) return;
  const rows = [];
  let total = 0; recTimes.forEach(v => total += v);
  deck.slides.forEach((s, i) => {
    const ms = recTimes.get(s.id);
    if (ms) rows.push({ i, s, ms });
  });
  el.style.display = '';
  el.innerHTML = `<div class="recapcard">
    <h3>Rehearsal recap — ${fmtMs(total)} total</h3>
    <table><tr><th>Slide</th><th>Time</th><th style="width:180px"></th></tr>
    ${rows.map(r => `<tr><td>${r.i+1} · ${esc(slideTitle(r.s))}</td><td class="tm">${fmtMs(r.ms)}</td>
      <td><div class="bar" style="width:${Math.max(3, Math.round(r.ms / total * 100))}%"></div></td></tr>`).join('')}
    </table>
    <div class="mrow"><button class="btn primary" data-recapclose="1">Close</button></div></div>`;
  el.querySelector('[data-recapclose]').addEventListener('click', () => { el.style.display = 'none'; el.innerHTML = ''; });
}

function initInk() {
  const cv = $('#ink'); if (!cv) return;
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; };
  size();
  const ctx = cv.getContext('2d');
  let down = false;
  cv.addEventListener('pointerdown', e => {
    down = true;
    const col = theme(deck).vars['--acc'];
    ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = col; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', e => { if (down) { ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); } });
  const up = () => { down = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointerleave', up);
  cv._resize = () => { size(); };  // resizing clears the canvas, which is fine
}
function clearInk() { const cv = $('#ink'); if (cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

function renderPresent() {
  const t = theme(deck);
  cur = Math.min(cur, deck.slides.length - 1);
  if (deck.slides[cur].hidden) { const v = visIdx(); cur = v.find(i => i >= cur) ?? v[v.length - 1]; }
  $('#app').innerHTML = `
  <div id="present" style="background:${t.bg};${themeVarStyle(t)}">
    ${deck.settings.ambient ? `<div class="amb">${t.ambient()}</div>` : ''}
    <div class="stagepos" id="stagepos"><div class="layer" id="curlayer"></div></div>
    <canvas id="ink"></canvas>
    <div class="chrome" id="chrome"></div>
    <div class="hud" id="hud" style="display:none"></div>
    <div class="notespanel" id="notespanel" style="display:none"></div>
    <div id="pgrid" style="display:none"></div>
    <div id="recap" style="display:none"></div>
    <div id="jumpind" style="display:none"></div>
    <div id="blackout" style="display:none"></div>
    <div id="laser" style="display:none"></div>
  </div>`;
  initInk();
  $('#curlayer').innerHTML = renderStage(deck.slides[cur], deck, '', { cueLift: deck.settings.showSkip, orgLift: deck.settings.showCounter });
  hudStart = Date.now();
  autoRun = !!deck.settings.autoPlay;
  fitStage();
  renderChrome();
  wakeChrome();
  renderHud();
  scheduleAuto();
}

function scheduleAuto() {
  clearTimeout(autoTimer);
  if (mode !== 'present' || !autoRun) return;
  const s = deck.slides[cur];
  const secs = Math.max(1, parseFloat(s.duration) || deck.settings.autoSeconds || 8);
  autoTimer = setTimeout(() => {
    const v = visIdx();
    if (v.indexOf(cur) >= v.length - 1) {
      if (deck.settings.autoLoop) goTo(v[0]);
      else { autoRun = false; renderChrome(); }
    } else navStep(1);
  }, secs * 1000);
}

function fmtElapsed() {
  const s = Math.floor((Date.now() - hudStart) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
}

function renderHud() {
  const el = $('#hud'); if (!el) return;
  clearInterval(hudInterval); hudInterval = null;
  if (!hudOn) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const t = theme(deck);
  const v = visIdx();
  const next = deck.slides[v[v.indexOf(cur) + 1]];
  el.style.display = '';
  el.style.left = (railVisible() ? 260 : 24) + 'px';
  el.innerHTML = `
    <div class="hud-top">
      <span class="hud-timer" id="hudtimer">${fmtElapsed()}</span>
      <span class="hud-reset" data-hudreset="1" title="Restart timer">⟲</span>
      <span class="hud-lbl">${next ? 'Next · ' + esc(slideTitle(next)) : 'Last slide'}</span>
    </div>
    ${next ? `<div class="hud-next"><div class="hud-stage" style="background:${t.bg};${themeVarStyle(t)}">${renderStage(next, deck, 'static', { cue:false })}</div></div>` : ''}
    <div class="hud-notes">${esc(deck.slides[cur].notes) || '<span style="opacity:.45">No notes for this slide.</span>'}</div>`;
  el.querySelector('[data-hudreset]').addEventListener('click', () => { hudStart = Date.now(); const tm = $('#hudtimer'); if (tm) tm.textContent = fmtElapsed(); });
  requestAnimationFrame(() => {
    const st = el.querySelector('.hud-stage');
    if (st) st.style.transform = `scale(${st.parentElement.getBoundingClientRect().width / 1920})`;
  });
  const tint = () => {
    const tm = $('#hudtimer'); if (!tm) return;
    tm.textContent = fmtElapsed();
    const target = parseFloat(deck.settings.targetMinutes) * 60000;
    if (target > 0) {
      const r = (Date.now() - hudStart) / target;
      tm.style.color = r >= 1 ? '#ff7a66' : r >= .9 ? 'var(--acc2, #DE6B2C)' : '';
    }
  };
  tint();
  hudInterval = setInterval(() => {
    if ($('#hudtimer')) tint(); else { clearInterval(hudInterval); hudInterval = null; }
  }, 1000);
}

function fitStage() {
  const el = $('#stagepos'); if (!el) return;
  const railW = railVisible() ? 236 : 0;
  const sc = Math.min((innerWidth - railW) / 1920, innerHeight / 1080);
  el.style.left = `calc(50% + ${railW / 2}px)`;
  el.style.transform = `translate(-50%,-50%) scale(${sc})`;
}
window.addEventListener('resize', () => { if (mode === 'present') fitStage(); });

function railVisible() {
  return railOverride === null ? deck.settings.nav === 'thumbs' : railOverride;
}

function renderChrome() {
  const ch = $('#chrome'); if (!ch) return;
  const v = visIdx();
  const rail = railVisible();
  let html = '';
  if (rail) {
    html += `<div class="thumbrail">` + v.map((i, pos) => { const s = deck.slides[i]; return `
      <div class="thumb ${i===cur?'on':''} ${s.parentId?'child':''}" data-go="${i}">
        <div class="tstage" style="width:1920px;height:1080px;background:${theme(deck).bg};${themeVarStyle(theme(deck))}">${renderStage(s, deck, 'static')}</div>
        <div class="tlabel">${pos+1} · ${esc(slideTitle(s))}</div>
      </div>`; }).join('') + `</div>`;
  } else {
    html += `<div class="navpill">
      <div class="navarrow" data-nav="prev" title="Previous">‹</div>
      <div class="dots">${v.map(i => { const s = deck.slides[i]; return `<div class="dot ${i===cur?'on':''} ${s.layout==='section'?'parent':''}" data-go="${i}" title="${esc(slideTitle(s))}"></div>`; }).join('')}</div>
      <div class="navarrow" data-nav="next" title="Next">›</div>
    </div>`;
  }
  if (deck.settings.showCounter) html += `<div class="counter" style="left:${rail ? 260 : 44}px">${v.indexOf(cur)+1} / ${v.length}</div>`;
  if (autoRun) html += `<div class="autopill" style="left:${rail ? 260 : 44}px">▶ Auto</div>`;
  if (recOn) html += `<div class="recpill"><i></i>Rec</div>`;
  if (deck.settings.showSkip) html += `<div class="skipbtn" data-nav="end">Skip to end ↦</div>`;
  if (!PLAYER) html += `<button class="cornerbtn editbtn" data-nav="edit">✎ Edit</button>`;
  if (helpOn) html += helpHTML();
  ch.innerHTML = html;

  $$('[data-go]', ch).forEach(el => el.addEventListener('click', () => goTo(+el.dataset.go)));
  $$('[data-nav]', ch).forEach(el => el.addEventListener('click', () => {
    const a = el.dataset.nav;
    if (a === 'prev') navStep(-1);
    else if (a === 'next') navStep(1);
    else if (a === 'end') { const v2 = visIdx(); goTo(v2[v2.length - 1]); }
    else if (a === 'edit') switchMode('design');
  }));
  /* scale thumbnails to their container */
  requestAnimationFrame(() => {
    $$('.thumb .tstage', ch).forEach(el => {
      const w = el.parentElement.getBoundingClientRect().width;
      el.style.transform = `scale(${w / 1920})`;
    });
    const on = $('.thumb.on', ch);
    if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest' });
  });
  fitStage();
  renderNotes();
}

function helpHTML() {
  return `<div class="helpov" data-help="1"><div class="helpcard">
    <h3>Keyboard shortcuts</h3><table>
      <tr><td class="k">→ ↓ Space / PgDn</td><td>Next slide</td></tr>
      <tr><td class="k">← ↑ / PgUp</td><td>Previous slide</td></tr>
      <tr><td class="k">Home / End</td><td>First / last slide</td></tr>
      <tr><td class="k">N</td><td>Toggle speaker notes</td></tr>
      <tr><td class="k">P</td><td>Presenter HUD (timer · next slide · notes)</td></tr>
      <tr><td class="k">A</td><td>Pause / resume autoplay</td></tr>
      <tr><td class="k">T</td><td>Toggle thumbnail rail</td></tr>
      <tr><td class="k">L</td><td>Laser pointer</td></tr>
      <tr><td class="k">D</td><td>Draw on the slide (C clears; ink clears on slide change)</td></tr>
      <tr><td class="k">G</td><td>Slide grid — click any slide to jump</td></tr>

      <tr><td class="k">F</td><td>Fullscreen</td></tr>
      <tr><td class="k">Esc</td><td>Back to designer</td></tr>
      <tr><td class="k">?</td><td>This help</td></tr>
    </table></div></div>`;
}

function renderNotes() {
  const p = $('#notespanel'); if (!p) return;
  const s = deck.slides[cur];
  if (notesOn && s) {
    p.style.display = '';
    p.innerHTML = `<h4>Notes — slide ${cur+1}</h4><div>${esc(s.notes) || '<span style="opacity:.5">No notes for this slide.</span>'}</div>`;
  } else p.style.display = 'none';
}

function goTo(n) {
  const i = Math.max(0, Math.min(deck.slides.length - 1, n));
  if (i === cur) return;
  if (recOn) recLog();
  const dir = i > cur ? 1 : -1;
  cur = i;
  const pos = $('#stagepos');
  const old = $('#curlayer');
  const tr = deck.settings.transition;
  const nl = document.createElement('div');
  nl.className = 'layer'; nl.id = 'curlayer';
  nl.innerHTML = renderStage(deck.slides[cur], deck, '', { cueLift: deck.settings.showSkip, orgLift: deck.settings.showCounter });
  if (old) old.removeAttribute('id');
  if (tr === 'none') {
    if (old) old.remove();
    pos.appendChild(nl);
  } else {
    const map = {
      fade:  { in:'fade .5s ease both',        out:'fadeOut .45s ease both' },
      slide: { in:(dir>0?'inFromR':'inFromL') + ` .55s ${EASE} both`, out:(dir>0?'outToL':'outToR') + ` .5s ${EASE} both` },
      zoom:  { in:`zoomInLayer .55s ${EASE} both`, out:`zoomOutLayer .5s ${EASE} both` }
    };
    const m = map[tr] || map.fade;
    if (old) { old.style.animation = m.out; old.style.zIndex = 1; setTimeout(() => old.remove(), 600); }
    nl.style.animation = m.in;
    pos.appendChild(nl);
  }
  renderChrome();
  wakeChrome();
  renderHud();
  scheduleAuto();
  clearInk();
}

function wakeChrome() {
  const ch = $('#chrome'); if (!ch) return;
  ch.classList.remove('hidden');
  clearTimeout(chromeTimer);
  if (deck.settings.autoHideChrome) {
    chromeTimer = setTimeout(() => { const c = $('#chrome'); if (c && !helpOn) c.classList.add('hidden'); }, 3200);
  }
}

/* ---------------- print view ---------------- */
let printHandout = false;
function renderPrint() {
  const t = theme(deck);
  const slides = deck.slides.filter(s => !s.hidden);
  const stage = s => `<div class="ppage"><div class="pstage" style="width:1920px;height:1080px;background:${t.bg};${themeVarStyle(t)}">${renderStage(s, deck, 'static', { cue:false })}</div></div>`;
  const pages = printHandout
    ? slides.map((s, i) => `
      <div class="hpage">${stage(s)}
        <div class="hnotes">
          <div class="hn-title">${i+1} · ${esc(slideTitle(s))}</div>
          ${s.cue ? `<div class="hn-cue">✎ ${esc(s.cue)}</div>` : ''}
          <div class="hn-body">${esc(s.notes) || '<span style="opacity:.45">—</span>'}</div>
        </div></div>`).join('')
    : slides.map(s => stage(s)).join('');
  $('#app').innerHTML = `
  <div id="printview">
    <div class="printbar">
      <button class="btn" data-act="backdesign">← Back to designer</button>
      <button class="btn ${printHandout?'':'primary'}" data-act="pm-slides">Slides</button>
      <button class="btn ${printHandout?'primary':''}" data-act="pm-handout">Handout (with notes)</button>
      <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
      <span class="note">Tip: choose ${printHandout ? 'Portrait' : 'Landscape'}, margins None, and enable Background graphics.</span>
    </div>
    <div id="pages">${pages}</div>
  </div>
  <style>@media print { @page { size:${printHandout ? '8.5in 11in' : '11in 6.19in'}; margin:${printHandout ? '.5in' : '0'}; } }</style>`;
  const fit = () => $$('.ppage').forEach(pg => {
    const st = $('.pstage', pg);
    st.style.transform = `scale(${pg.getBoundingClientRect().width / 1920})`;
  });
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('beforeprint', fit);
  window.addEventListener('afterprint', fit);
}

/* ---------------- mode switching / routing ---------------- */
function switchMode(m) {
  if (PLAYER) m = 'present';
  mode = m;
  notesOn = false; helpOn = false; railOverride = null;
  hudOn = false; autoRun = false; laserOn = false; drawOn = false;
  gridOn = false; blackOn = false; jumpBuf = ''; recOn = false; recTimes = null;
  clearTimeout(autoTimer); clearInterval(hudInterval); hudInterval = null; clearTimeout(jumpTimer);
  const hash = m === 'present' ? '#present' : m === 'print' ? '#print' : '';
  if (location.hash !== hash) { try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (e) {} }
  if (m === 'present') cur = sel;
  renderApp();
}
window.addEventListener('hashchange', () => {
  if (PLAYER) return;
  const h = location.hash;
  const m = h === '#present' ? 'present' : h === '#print' ? 'print' : 'design';
  if (m !== mode) { mode = m; renderApp(); }
});

/* ---------------- global events ---------------- */
document.addEventListener('click', e => {
  const mt = e.target.closest('[data-menu]');
  $$('.tbmenu.open').forEach(m => { if (!mt || !m.contains(mt)) m.classList.remove('open'); });
  if (mt) { mt.closest('.tbmenu').classList.toggle('open'); return; }
  const el = e.target.closest('[data-act]');
  if (el && !el.closest(".sl-item")) {
    const a = el.dataset.act;
    if (a === 'present') switchMode('present');
    else if (a === 'print') switchMode('print');
    else if (a === 'backdesign') switchMode('design');
    else if (a === 'add') layoutPicker();
    else if (a === 'json') jsonModal();
    else if (a === 'aiprompt') aiPromptModal();
    else if (a === 'guide') guideModal();
    else if (a === 'undo') doUndo();
    else if (a === 'redo') doRedo();
    else if (a === 'sorter') sorterModal();
    else if (a === 'pm-slides') { printHandout = false; renderPrint(); }
    else if (a === 'pm-handout') { printHandout = true; renderPrint(); }
    else if (a === 'decks') decksModal();
    else if (a === 'import') importJSON();
    else if (a === 'export') exportJSON();
    else if (a === 'playerexport') exportPlayer();
    else if (a === 'sample') { if (confirm('Open the sample deck as a new deck?')) { deck = validateDeck(sampleDeck()); sel = 0; touch(); resetHistory(); renderDesign(); } }
    else if (a === 'replay') renderPreview();
    else if (a === 'pvprev') { if (sel > 0) { sel--; renderSlideList(); renderProps(); renderPreview(); } }
    else if (a === 'pvnext') { if (sel < deck.slides.length - 1) { sel++; renderSlideList(); renderProps(); renderPreview(); } }
    else if (a === 'tab-slide') { propTab = 'slide'; renderDesign(); }
    else if (a === 'tab-deck') { propTab = 'deck'; renderDesign(); }
    return;
  }
  const item = e.target.closest('.sl-item');
  if (item && mode === 'design') {
    const i = +item.dataset.idx;
    const act = e.target.closest('.mini');
    if (act) {
      const a2 = act.dataset.act;
      if (a2 === 'up') moveSlide(i, -1);
      else if (a2 === 'down') moveSlide(i, 1);
      else if (a2 === 'dup') {
        const c = JSON.parse(JSON.stringify(deck.slides[i])); c.id = uid();
        deck.slides.splice(i + 1, 0, c); sel = i + 1;
        touch(); renderSlideList(); renderProps(); renderPreview();
      } else if (a2 === 'del') {
        if (deck.slides.length === 1) { alert('A deck needs at least one slide.'); return; }
        if (!confirm('Delete this slide?')) return;
        const gone = deck.slides.splice(i, 1)[0];
        deck.slides.forEach(s => { if (s.parentId === gone.id) s.parentId = null; });
        sel = Math.min(sel, deck.slides.length - 1);
        touch(); renderSlideList(); renderProps(); renderPreview();
      }
      return;
    }
    if (i !== sel) { sel = i; renderSlideList(); renderProps(); renderPreview(); }
  }
  const helpEl = e.target.closest('[data-help]');
  if (helpEl) { helpOn = false; renderChrome(); }
});

document.addEventListener('mousemove', e => {
  if (mode !== 'present') return;
  wakeChrome();
  if (laserOn) { const l = $('#laser'); if (l) { l.style.left = e.clientX + 'px'; l.style.top = e.clientY + 'px'; } }
});
window.addEventListener('resize', () => { const cv = $('#ink'); if (cv && cv._resize) cv._resize(); });
document.addEventListener('mousedown', () => { if (mode === 'present') wakeChrome(); });

document.addEventListener('keydown', e => {
  if (mode !== 'present') {
    if (mode === 'print' && e.key === 'Escape') switchMode('design');
    if (mode === 'design' && e.key === 'Escape') $$('.tbmenu.open').forEach(m => m.classList.remove('open'));
    if (mode === 'design' && (e.ctrlKey || e.metaKey)) {
      const key = e.key.toLowerCase();
      if (key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
      else if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault(); doRedo(); }
      else if (key === 'f') { e.preventDefault(); searchModal(); }
    }
    return;
  }
  const k = e.key;
  if (blackOn) { e.preventDefault(); blackOn = false; updateBlack(); return; }
  if (/^[0-9]$/.test(k)) {
    e.preventDefault();
    jumpBuf = (jumpBuf + k).slice(0, 3); renderJumpInd();
    clearTimeout(jumpTimer); jumpTimer = setTimeout(() => { jumpBuf = ''; renderJumpInd(); }, 2200);
    return;
  }
  if (k === 'Enter' && jumpBuf) { e.preventDefault(); clearTimeout(jumpTimer); commitJump(); return; }
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ') { e.preventDefault(); navStep(1); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); navStep(-1); }
  else if (k === 'End') { e.preventDefault(); const v = visIdx(); goTo(v[v.length - 1]); }
  else if (k === 'Home') { e.preventDefault(); goTo(visIdx()[0]); }
  else if (k === 'n' || k === 'N') { notesOn = !notesOn; renderNotes(); }
  else if (k === 'p' || k === 'P') { hudOn = !hudOn; renderHud(); }
  else if (k === 'a' || k === 'A') { autoRun = !autoRun; scheduleAuto(); renderChrome(); wakeChrome(); }
  else if (k === 'l' || k === 'L') { laserOn = !laserOn; const l = $('#laser'); if (l) l.style.display = laserOn ? '' : 'none'; }
  else if (k === 'd' || k === 'D') { drawOn = !drawOn; const p = $('#present'); if (p) p.classList.toggle('drawing', drawOn); }
  else if (k === 'c' || k === 'C') { clearInk(); }
  else if (k === 'g' || k === 'G') { gridOn = !gridOn; renderPGrid(); }
  else if (k === 'b' || k === 'B') { blackOn = true; updateBlack(); }
  else if (k === 'r' || k === 'R') {
    if (!recOn) { recOn = true; recTimes = new Map(); recMark = Date.now(); renderChrome(); wakeChrome(); }
    else { recLog(); recOn = false; renderChrome(); showRecap(); }
  }
  else if (k === 't' || k === 'T') { railOverride = !railVisible(); renderChrome(); wakeChrome(); }
  else if (k === 'f' || k === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  else if (k === '?') { helpOn = !helpOn; renderChrome(); wakeChrome(); }
  else if (k === 'Escape') { if (helpOn) { helpOn = false; renderChrome(); } else if (!PLAYER) switchMode('design'); }
});

/* ---------------- init ---------------- */
/* one-time migration from the tool's earlier name (BetterSlides) */
async function migrateLegacy() {
  try {
    if ((await DB.all()).length) return;
    const old = await new Promise((res, rej) => {
      const r = indexedDB.open('betterslides', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('decks', { keyPath:'id' }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    const recs = await new Promise((res, rej) => {
      const rq = old.transaction('decks', 'readonly').objectStore('decks').getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => rej(rq.error);
    });
    for (const rec of recs) await DB.put(rec);
    old.close();
    indexedDB.deleteDatabase('betterslides');
    const oldCur = localStorage.getItem('bs-current');
    if (oldCur && !localStorage.getItem('gr-current')) localStorage.setItem('gr-current', oldCur);
    localStorage.removeItem('bs-current');
  } catch (e) { console.warn('Legacy migration skipped:', e); }
}

(async function init() {
  if (PLAYER) {
    try { deck = validateDeck(JSON.parse(BAKED.textContent)); } catch (e) { console.error(e); }
    if (!deck) deck = newDeck('Empty deck');
    resetHistory();
    mode = 'present'; cur = 0;
    renderApp();
    return;
  }
  await migrateLegacy();
  try {
    const id = localStorage.getItem('gr-current');
    if (id) {
      const rec = await DB.get(id);
      if (rec) deck = validateDeck(JSON.parse(rec.json));
    }
    if (!deck) {
      const all = await DB.all();
      if (all.length) deck = validateDeck(JSON.parse(all.sort((a,b) => b.updated - a.updated)[0].json));
    }
  } catch (e) { console.error('Storage unavailable:', e); }
  if (!deck) { deck = validateDeck(sampleDeck()); persist(); }
  resetHistory();
  const h = location.hash;
  mode = h === '#present' ? 'present' : h === '#print' ? 'print' : 'design';
  renderApp();
  try {
    if (mode === 'design' && !localStorage.getItem('gr-guide-seen')) {
      localStorage.setItem('gr-guide-seen', '1');
      guideModal();
    }
  } catch (e) {}
})();
</script>
